{%- assign contact = site.data.shoreline_pages.contact -%}
<footer class="sl-footer">
    <div class="sl-container">
        <p>{{ contact.address }} · Need help? <a href="tel:{{ contact.help_phone_tel }}">{{ contact.help_phone }}</a> · General: <a href="tel:{{ contact.phone_tel }}">{{ contact.phone }}</a> · <a href="mailto:{{ contact.email }}">{{ contact.email }}</a></p>
        <p>A student redesign project for <a href="{{ contact.official_site }}">Shoreline Community Services</a>. This is not the official Shoreline website.</p>
        <p><a href="{{ '/capstone/shoreline-volunteer/' | relative_url }}">About this project</a></p>
    </div>
</footer>
<script type="module">
// Floating language button, bottom right of every Shoreline page.
import { mountLanguageButton } from '{{ site.baseurl }}/assets/js/shoreline/language-fab.js';
mountLanguageButton('{{ "/shoreline/preferences" | relative_url }}');
</script>
