    - { icon: "🙋", heading: "Volunteers", text: "Coordinated by hand through calls and messages, not always where the need is greatest." }
    - { icon: "💝", heading: "Donations", text: "Mostly through an Instagram link, and donors can't easily see what a gift does." }
    - { icon: "🧭", heading: "People Seeking Help", text: "Need a quick, simple way to find services and reach the outreach team." }
    - { icon: "📊", heading: "Your Impact", text: "Real, but hard for the public to see in numbers." }

